name: Containerize FastAPI App and push to Docker Hub
on:
  pull_request:
    branches:
      - develop
    types:
      - closed
jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout microservice codebase
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build artistquery image
        working-directory: ./microservice/artistquery
        run: ./release.sh
      - name: Build product image
        working-directory: ./microservice/product
        run: ./release.sh
      
