user nginx;
worker_processes auto;
# load_module modules/ngx_http_js_module.so;

error_log /app/log/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # js_import /app/njs/authService.js;
  include /etc/nginx/mime.types;
  default_type application/json;
  server_tokens off;

  log_format main '[$time_iso8601]: Request="$request",IP="$remote_addr",UserAgent="$http_user_agent",Status=$status,'
                      'BodyBytesSent=$body_bytes_sent,Referrer="$http_referer",XForwardedFor="$http_x_forwarded_for",Authorization="$http_authorization"'
  access_log /app/log/access.log main;
  
  sendfile on;
  gzip on;
  keepalive_timeout 65;

  upstream echovibe-artistcommand {
    server echovibe-artistcommand-i1:6100;
  }

  # server {
  #   listen 80;
  #   server_name api-local.echovibe.io.vn www.api-local.echovibe.io.vn;
  #   return 301 https://$host$request_uri;
  # }

  server {
    # listen 443 ssl;
    listen 80;
    server_name api-local.echovibe.io.vn www.api-local.echovibe.io.vn;

    # TLS
    # ssl_certificate /app/tls/certificate.crt;
    # ssl_certificate_key /app/tls/private.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    location /oauth {
      internal;
      proxy_pass https://auth.echovibe.io.vn/realms/echovibe/protocol/openid-connect/token;
      proxy_method POST;
      proxy_set_header Content-Type "application/x-www-form-urlencoded";
      proxy_set_body "audience=echovibe&permission_resource_format=uri&permission_resource_matching_uri=true&grant_type=urn:ietf:params:oauth:grant-type:uma-ticket&permission=$request_uri#$request_method";
    }

    location /v1/artists {
      auth_request /oauth;

      proxy_pass http://echovibe-artistcommand;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-ID $request_id;

      # Preflight request (CORS)
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' '*';
        add_header 'Access-Control-Allow-Headers' '*';
        return 204;
      }
    }
  }
}
