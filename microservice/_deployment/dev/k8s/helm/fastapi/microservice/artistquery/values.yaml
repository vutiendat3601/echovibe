deployment:
  name: artistquery
  containerPort: 6110
  replicaCount: 1
  image: 
    repository: vutiendat3601/echovibe-artistquery
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 6110
    protocol: TCP
    hostname: api.echovibe.io.vn
    exposePathPrefix: /query/v1/artists
    replacePrefixMatch: /v1/artists
kafka:
  enabled: true
openidconnect:
  enabled: false
database:
  enabled: true
  vendor: "postgresql+psycopg"
  username: echovibe_artistquery
  password: echovibe_artistquery
  host: infras.echovibe.io.vn
  port: 16110
  name: echovibe_artistquery
