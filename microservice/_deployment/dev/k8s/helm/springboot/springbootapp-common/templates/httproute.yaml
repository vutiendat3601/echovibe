{{- define "springbootapp-common.httproute" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "{{ .Values.deployment.name }}-httproute"
  namespace: {{ .Values.global.namespace }}
spec:
  parentRefs:
  - name: "{{ .Values.global.gatewayName }}-gateway"
    namespace: {{ .Values.global.namespace }}
  hostnames:
  - {{ .Values.deployment.service.hostname }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.deployment.service.exposePathPrefix }}
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: {{ .Values.deployment.service.replacePrefixMatch }}
    backendRefs:
    - name: "{{ .Values.deployment.name }}-svc"
      port: {{ .Values.deployment.service.port }}
      namespace: {{ .Values.global.namespace }}
{{- end -}}
