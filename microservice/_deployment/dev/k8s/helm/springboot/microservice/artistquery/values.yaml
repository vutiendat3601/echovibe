deployment:
  name: artistquery
  containerPort: 6110
  replicaCount: 1
  image: 
    repository: vutiendat3601/echovibe-artistquery
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 6110
    protocol: TCP
    hostname: api.echovibe.io.vn
    exposePathPrefix: /query/v1/artists
    replacePrefixMatch: /v1/artists
openidconnect:
  enabled: true
kafka:
  enabled: true
mongo:
  enabled: false
  uri: 
datasource:
  enabled: true
  url: jdbc:postgresql://infras.echovibe.io.vn:16110/echovibe_artistquery
  username: echovibe_artistquery
  password: echovibe_artistquery
