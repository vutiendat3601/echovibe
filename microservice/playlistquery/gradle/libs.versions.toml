# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
javaVersion = "21"
springCloudVersion = "2024.0.0"
springBootVersion = "3.4.2"
springBootAdminVersion = "3.4.1"
springDependencyManagementVersion = "1.1.7"
hypersistenceUtilsHibernate63Version = "3.9.0"
spotlessVersion = "7.0.2"

[libraries]
hypersistenceUtilsHibernate60 = { group = "io.hypersistence", name="hypersistence-utils-hibernate-63", version.ref="hypersistenceUtilsHibernate63Version" }

[plugins]
springBootPlugin = { id = "org.springframework.boot", version.ref = "springBootVersion" }
springDependencyManagementPlugin = { id = "io.spring.dependency-management", version.ref = "springDependencyManagementVersion" }
spotlessPlugin = { id = "com.diffplug.spotless", version.ref = "spotlessVersion" }
