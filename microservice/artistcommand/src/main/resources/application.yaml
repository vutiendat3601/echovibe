server:
  port: 6100
management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
spring:
  application:
    name: artistcommand
  docker:
    compose:
      enabled: false
  cloud:
    stream:
      bindings:
        createArtistDetails-out-0:
          destination: createArtistDetails
springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /openapi.html
