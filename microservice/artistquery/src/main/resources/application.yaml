server:
  port: 6110
management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
spring:
  application:
    name: artistquery
    version: 1.0.0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  docker:
    compose:
      enabled: false
  cloud:
    function:
      definition: consumeArtistCreatedEvent
    stream:
      bindings:
        consumeArtistCreatedEvent-in-0:
          destination: "artist.ArtistCreatedEvent"
          group: "${spring.application.name}"
springdoc:
  api-docs:
    path: /v1/artists/openapi
  swagger-ui:
    path: /v1/artists/openapi.html
